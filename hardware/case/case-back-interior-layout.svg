<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="885" viewBox="0 0 1510 885" role="img" aria-labelledby="title desc">
  <title id="title">Chapter Player case back interior layout</title>
  <desc id="desc">Annotated CAD view looking into the v5 case back, showing Raspberry Pi, amplifier, USB-C, and speaker mounting areas.</desc>
  <defs>
    <style>
      .photo { opacity: 0.95; }
      .panel { fill: rgba(255, 255, 255, 0.88); stroke: #1f2933; stroke-width: 2; }
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label-title { font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .small { font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .badge-text { font: 800 27px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .leader { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .callout-area { fill-opacity: 0.14; stroke-width: 5; stroke-dasharray: 12 9; }
      .ring { fill: rgba(255, 255, 255, 0.18); stroke-width: 6; }
      .one { stroke: #2563eb; }
      .one-fill { fill: #2563eb; }
      .two { stroke: #16a34a; }
      .two-fill { fill: #16a34a; }
      .three { stroke: #7c3aed; }
      .three-fill { fill: #7c3aed; }
      .four { stroke: #ea580c; }
      .four-fill { fill: #ea580c; }
    </style>
  </defs>

  <rect width="1510" height="885" fill="#c9d4d5"/>
  <image class="photo" href="images/case-back-interior-cad-view.png" x="0" y="0" width="1510" height="885" preserveAspectRatio="xMidYMid meet"/>

  <rect x="28" y="24" width="612" height="92" rx="10" class="panel"/>
  <text x="52" y="64" class="title">Case Back Interior Layout</text>
  <text x="52" y="96" class="small">Mount holes: install M2.5 heat press threaded inserts; use M2.5x5 mm screws.</text>

  <!-- 1. Raspberry Pi Zero 2 W/WH mount -->
  <rect x="226" y="137" width="509" height="244" rx="7" class="callout-area one" fill="#2563eb"/>
  <path d="M 425 218 L 414 154" class="leader one"/>
  <circle cx="414" cy="154" r="23" class="one-fill"/>
  <text x="414" y="154" class="badge-text">1</text>
  <rect x="515" y="132" width="296" height="70" rx="10" class="panel"/>
  <text x="537" y="164" class="label-title">1 Raspberry Pi</text>
  <text x="537" y="190" class="label">Zero 2 W/WH mount holes</text>

  <!-- 2. MAX98357A I2S amplifier mount -->
  <rect x="1028" y="376" width="176" height="70" rx="7" class="callout-area two" fill="#16a34a"/>
  <path d="M 1120 410 L 1161 310" class="leader two"/>
  <circle cx="1161" cy="310" r="23" class="two-fill"/>
  <text x="1161" y="310" class="badge-text">2</text>
  <rect x="973" y="226" width="330" height="74" rx="10" class="panel"/>
  <text x="996" y="258" class="label-title">2 MAX98357A</text>
  <text x="996" y="285" class="label">I2S amplifier mount holes</text>

  <!-- 3. Adafruit 5993 vertical USB-C mount -->
  <rect x="1002" y="582" width="229" height="127" rx="8" class="callout-area three" fill="#7c3aed"/>
  <path d="M 1115 641 L 1300 715" class="leader three"/>
  <circle cx="1300" cy="715" r="23" class="three-fill"/>
  <text x="1300" y="715" class="badge-text">3</text>
  <rect x="1004" y="732" width="386" height="86" rx="10" class="panel"/>
  <text x="1028" y="764" class="label-title">3 Adafruit 5993</text>
  <text x="1028" y="791" class="label">Vertical Type-C USB mount holes</text>

  <!-- 4. Visaton speaker heat press insert mounts -->
  <rect x="210" y="406" width="432" height="411" rx="8" class="callout-area four" fill="#ea580c"/>
  <circle cx="242" cy="439" r="31" class="ring four"/>
  <circle cx="603" cy="438" r="31" class="ring four"/>
  <circle cx="254" cy="789" r="37" class="ring four"/>
  <circle cx="608" cy="789" r="37" class="ring four"/>
  <g>
    <circle cx="242" cy="439" r="20" class="four-fill"/>
    <circle cx="603" cy="438" r="20" class="four-fill"/>
    <circle cx="254" cy="789" r="20" class="four-fill"/>
    <circle cx="608" cy="789" r="20" class="four-fill"/>
    <text x="242" y="439" class="badge-text">4</text>
    <text x="603" y="438" class="badge-text">4</text>
    <text x="254" y="789" class="badge-text">4</text>
    <text x="608" y="789" class="badge-text">4</text>
  </g>
  <path d="M 603 438 L 684 562" class="leader four"/>
  <path d="M 608 789 L 684 648" class="leader four"/>
  <rect x="296" y="548" width="400" height="112" rx="10" class="panel"/>
  <text x="320" y="581" class="label-title">4 Visaton FRWS 5 speaker</text>
  <text x="320" y="610" class="label">4 Ohm, M2.5 heat press threaded inserts</text>
  <text x="320" y="637" class="label">Use M2.5x5 mm screws</text>
</svg>
