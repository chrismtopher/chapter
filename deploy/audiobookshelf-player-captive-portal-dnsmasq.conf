# Used by NetworkManager shared-mode hotspots.
# Resolve every hostname to the setup hotspot gateway so HTTP browser traffic
# lands on the local setup page while the device is offline.
address=/#/10.42.0.1

# Advertise the captive portal URL to clients that understand RFC 8910 or
# common pre-standard DHCP captive portal options.
dhcp-option=114,http://10.42.0.1/
dhcp-option=160,http://10.42.0.1/
