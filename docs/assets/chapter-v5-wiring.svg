<text x="35" y="320" class="label" text-anchor="start">Use only VBUS and GND.</text>
<text x="35" y="343" class="small" text-anchor="start">Leave D+, D−, CC and SBU open.</text>
<text x="35" y="370" class="small" text-anchor="start">The 5993 path is rated up to 1.5 A. The 3 mm LED has a built-in resistor and a white-marked positive lead.</text>
