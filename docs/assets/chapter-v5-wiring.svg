<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="wiring-title wiring-description">
<title id="wiring-title">Chapter Player v5 complete wiring diagram</title>
<desc id="wiring-description">Read from top to bottom. Two power rails feed the Pi, amp and indicator. The middle shows every used physical header pin and its remote terminal. Pin 1 splits to two devices. The speaker connects only to the amplifier outputs. The install guide contains the same connections in text.</desc>
<style>
  text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #172e35; }
  .kicker, .caption { font-size: 14px; font-weight: 600; letter-spacing: 1.2px; }
  .kicker { fill: #20605f; }
  .title { font-size: 38px; font-weight: 700; }
  .section { font-size: 24px; font-weight: 700; }
  .body, .label, .small { font-size: 16px; }
  .label { font-weight: 600; }
  .small, .caption { fill: #435b62; }
  .pin { font-size: 15px; font-weight: 700; }
  .terminal, .outer, .board, .fuse, .dot5, .dot0, .dot3, .unused { stroke-width: 1.3; }
  .outer, .terminal, .fuse { fill: white; stroke: #587276; }
  .board { fill: #e4f1ed; stroke: #6b8882; }
  .unused { fill: #edf4f2; stroke: #aac0ba; }
  .signal, .five, .gnd, .three, .audio, .rule { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .signal, .audio { stroke: #206b79; stroke-width: 2; }
  .five { stroke: #ae3a24; stroke-width: 3; }
  .gnd { stroke: #39464f; stroke-width: 2.4; }
  .three { stroke: #7a4781; stroke-width: 2.4; }
  .rule { stroke: #c8d7d3; stroke-width: 1; }
  .dot5 { fill: #ae3a24; stroke: #ae3a24; }
  .dot0 { fill: #39464f; stroke: #39464f; }
  .dot3 { fill: #7a4781; stroke: #7a4781; }
</style>
<rect width="900" height="1300" fill="#fff"/>

