<text x="659" y="1103" class="label" text-anchor="start">Visaton FRWS 5</text>
<text x="659" y="1127" class="small" text-anchor="start">4 Ω speaker</text>
<text x="35" y="1177" class="body" text-anchor="start">Keep both speaker leads off ground. Leave amp SD / SD_MODE open.</text>
<text x="35" y="1203" class="small" text-anchor="start">Disconnect USB-C before fitting leads. Keep the Pi micro-USB power input empty during case-powered use.</text>
</g>
<path d="M35 1220H865" class="rule"/>
<g id="meter-check">
<text x="35" y="1249" class="label" text-anchor="start">Before connecting the Pi</text>
<text x="35" y="1272" class="body" text-anchor="start">With Pi, amp and LED disconnected, power just the harness. Use DC volts, red to the pin 2 lead,</text>
<text x="35" y="1292" class="body" text-anchor="start">black to the pin 20 lead. Expect about +5 V. Unplug USB-C before attaching the loads.</text>
</g>
</svg>
